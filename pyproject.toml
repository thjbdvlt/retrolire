[project]
name = "otlet"
authors = [{name="thjbdvlt"}]
version = "0.1.0"
description = "command line bibliography management with fzf and sqlite3"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "orjson",
    "pdfannots @ git+https://github.com/thjbdvlt/pdfannots",
    "pymupdf",
    "isbntools",
]

[project.urls]
Homepage = "https://github.com/thjbdvlt/otlet"

[project.scripts]
csljson-update = "csljson_update.cli:main"
pdfannots = "pdfannots.cli:main"
fetchref = "fetchref.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = {}

[tool.ruff]
exclude = []
line-length = 72

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false
